[project]
name = "pontifex"
version = "1.0.0"
description = "Pontifex: Dual-Path Gated Ensemble & Footprint-Corrected Photometric Redshift Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "The Pontifex Team & DESC Data Challenge Collaboration" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    "numpy",
    "pandas",
    "astropy",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "joblib",
    "minisom",
    "tables_io",
    "qp-prob",
    "optunity",
]

[project.scripts]
pontifex-estimate = "pontifex.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black"
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx-autoapi"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pontifex*"]
